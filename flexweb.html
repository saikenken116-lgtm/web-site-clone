<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web with Flex</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .navbar{
            background-color: lightyellow;

        }
        .list a{
            text-decoration: none;
            color: black;
        }
        .list{ 
            color: black;
            display: flex;
            list-style: none;
            justify-content: space-evenly;
            align-items: center;
            height: 50px;
        }
        .hero{
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 600px;
            background-color: lightblue;
        }
        .box{
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: white;
            display: flex;
            justify-content: right;
            align-items: center;
        }

    </style>
</head>
<body>
    <nav class="navbar">
        <ul class="list">
            <li><a href="HOME">Home</a></li> 
            <li><a href="BLOG">Blog</a></li>
            <li><a href="PRODUCT">Product</a></li>
            <li><a href="SERVICES">Services</a></li>
            <li><a href="CONTACT">Contact</a></li>
        </ul>
    </nav>

    <!-- hero section -->
     <section class="hero">
        <h1>Welcome to our website</h1>
        <span>these are the descriptions</span>
        
             <div class="box">
                chat
             </div>
    </section>
    
</body>
</html>
