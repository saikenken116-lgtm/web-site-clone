<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 100vh;
            width: auto;
            border: 1px solid black;
            display: grid;
            grid-template-columns: 1fr 6fr;
            grid-template-rows: 1fr 10fr;
            grid-template-areas: 
            "lt rt" 
            "lb rb";
        }
        .leftop{
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            font-size: 22px;
        }

        .leftop{
            grid-area: lt;
            background-color: #343A40;
            border: 1px solid #3E454B;
        }
        .leftbottom{
             grid-area: lb;
            background-color: #343A40;
            border: 1px solid #3E454B;

        }
        .righttop{
             grid-area: rt;
            background-color:#212529 ;
            border: 1px solid #3E454B;

        }
        .rightbottom{
             grid-area: rb;
            background-color:#2B3035 ;
            border: 1px solid #3E454B;

        }
        .righttop nav.first{
            padding: 30px ;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .first{
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .left{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            font-size: 16px;
            gap: 14px;
            color: #B6B5B9;
        }
        .right{
            gap: 10px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            font-size: 16px;
            color: #B6B5B9;
        }
        .rightbottom .top{
            display: flex;
            justify-content:space-between ;
            align-items:flex-start;
            padding: 30px 30px;
            color: #FFFFFF;
        }
        .off{
            font-size:20px;
        }
        .rightbottom .middle{
            height: 100px;
            display: flex;
            margin-left: 20px;
            justify-content: space-between;
        }
        .box1, .box2, .box3, .box4{
            border: #C6303E;
            border-radius: 20px;
            display: flex;
            width: 270px;
            flex-direction: column;
            gap: 0px;
        }
        .box1-1{
            background-color: #0D6EFD;;
        }
        .box1-2{
            background-color: #0C63E3;
        }
        .box2-1{
            background-color: #198754;

        }
        .box2-2{
            background-color: #16794B;

        }

        .box3-1{
            background-color: #FFC107;

        }
        .box3-2{
            background-color: #E5AD06;
        }
        .box4-1{
            background-color: #DC3545;

        }
        
        .box4-2{
            background-color: #C6303E;

        }
         .leftbottom{ 
            display: flex;
            flex-direction: column;
            font-size: 20px;
            gap: 20px;
            align-items: center;
             color: #FAFAFB;
         } 
         .item1, .item2, .item3, .item4{
            display: flex;
            flex-direction: column;
            gap: 20px;;
         }
         .bottom{
            display: flex;
            margin: 40px 20px;
            gap: 10px;
            justify-content: space-between;
         }
         .imge1{
            border-radius: 20px;
         }
         .imge2{
            border-radius: 20px;
         }

    </style>
</head>
<body>
    <div class="container">
        <div class="leftop">
            <div>icon</div>
            <div>AdminLTE4</div>
        </div>
        <div class="righttop">

            <nav class="first">
                <div class="left">
                    <span>1</span>

                    <div>Documentation</div>
                </div>

                <div class="right">
                    <div>1</div>
                    <div>2</div>
                    <div>3</div>
                    <div>4</div>
                    <div>profile icon</div>

                </div>
            </nav>
        </div>
        
        
        <div class="leftbottom">

            <div class="middle">

                <div class="box2">

                <div class="box3">

                    </div>
                    <div class="box3-2">
                        <span>more info</span>
                    </div>
                </div>

                <div class="box4">
                    <div class="box4-1">
                        <h2>150</h2>
                        <p>NEW ORDERS</p>
                    </div>
                    <div class="box4-2">
                        <span>more info</span>

                </div>

            </div>
            <div class="bottom">
                <div class="imge1"><img src="imgee1.png" alt="imgee1"></div>

            </div>

        </div>
    </div>

    
</body>
</html>
